name: Rust

# Formatação, lint e testes do workspace. Roda em todo push na main e em todo PR.
# Não usa segredos. O check `guard` (ci-private-files.yml) continua sendo o único
# obrigatório no ruleset `protect-main`; este job entra lá por decisão do dono.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
