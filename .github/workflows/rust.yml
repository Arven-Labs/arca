name: Rust

# Formatação, lint e testes do workspace. Roda em todo push na main e em todo PR.
# Não usa segredos. O check `guard` (ci-private-files.yml) continua sendo o único
# obrigatório no ruleset `protect-main`; este job entra lá por decisão do dono.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Semanal, só na main: pega advisories publicados depois do último PR.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # Versão mínima do Rust (`rust-version` do Cargo.toml, medida em 2026-11-01: 1.88 por causa de
  # `sha2` 0.11 e de `slice::as_chunks`). Só compila a biblioteca; os testes usam APIs mais
  # novas e rodam no job `rust`. Se uma dependência subir o mínimo, este job vermelho avisa.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustc +1.88.0 --version

      - name: Check
        run: cargo +1.88.0 check --workspace --locked

  # Advisories do RustSec contra o Cargo.lock. A ferramenta é compilada do crates.io
  # numa versão fixa (sem ação de terceiros); o custo é alguns minutos por execução.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit
        run: cargo audit --deny warnings
