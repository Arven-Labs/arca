[package]
name = "arca-core"
version = "0.0.0"
description = "Núcleo da arca: armazenamento e sincronização local-first com criptografia no cliente"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
sha2 = "0.11.1"
thiserror = "2.0.21"
hkdf = "0.13.0"
chacha20poly1305 = "0.11.0"
zeroize = "1.9.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
tokio = { version = "1.53.3", default-features = false, features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.53.3", default-features = false, features = ["rt", "macros"] }
