[package]
name = "arca-core"
version = "0.0.0"
description = "Núcleo da arca: armazenamento e sincronização local-first com criptografia no cliente"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
sha2 = "0.11.1"
thiserror = "2.0.21"
hkdf = "0.13.0"
chacha20poly1305 = "0.11.0"
zeroize = "1.9.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
tokio = { version = "1.53.3", default-features = false, features = ["rt"] }
bip39 = { version = "=3.0.0", default-features = false, features = ["std", "zeroize"] }
# Cliente do hub (2b-1). Só rustls, HTTP/1, sem compressão. Redirecionamento e proxy do ambiente
# (`HTTP_PROXY`, `ALL_PROXY`) são desligados no código (`hub.rs`): `default-features = false` NÃO
# desliga a leitura das variáveis de ambiente.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }

[features]
# O `HubStore` (`Backend::Hub`). Ligada por padrão; `default-features = false` tira a rede do núcleo.
default = ["hub"]
hub = ["dep:reqwest", "tokio/time"]

[dev-dependencies]
tokio = { version = "1.53.3", default-features = false, features = ["rt", "macros"] }
# O hub de referência dos testes do `HubStore`.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
